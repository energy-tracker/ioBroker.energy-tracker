name: Auto-Merge Dependabot PRs

on:
    pull_request_target:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    pull_request_review:
        types: [submitted]

permissions:
    contents: read

concurrency:
    group: dependabot-automerge-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    auto-merge:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == 'main' &&
            !github.event.pull_request.draft &&
            (github.event_name == 'pull_request_target' || github.event.review.state == 'approved')
        runs-on: ubuntu-latest
        timeout-minutes: 65
        permissions:
            contents: write
            pull-requests: write
            checks: read

        steps:
            - name: Squash eligible Dependabot updates after CI
              uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  config-file-path: '.github/auto-merge.yml'
                  merge-method: 'squash'
                  wait-for-checks: 'true'
                  max-wait-time: '3600'
