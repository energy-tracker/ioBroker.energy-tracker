name: Auto-Merge Dependabot PRs

on:
    pull_request_target:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read

concurrency:
    group: dependabot-automerge-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    auto-merge:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
            pull-requests: write

        # Never check out or execute PR code with this workflow's write token.
        steps:
            - name: Read verified Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Enable squash auto-merge for eligible npm updates
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
              run: |
                  # Every dependency in a grouped update must satisfy the policy.
                  if ! jq -e 'length > 0 and all(.[];
                      .packageEcosystem == "npm_and_yarn" and (
                          (.dependencyType == "direct:production" and
                           .updateType == "version-update:semver-patch") or
                          (.dependencyType == "direct:development" and
                           (.updateType == "version-update:semver-patch" or
                            .updateType == "version-update:semver-minor"))
                      ))' <<< "$DEPENDENCIES" > /dev/null; then
                      if [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
                          gh pr merge "$PR_URL" --disable-auto
                      fi
                      echo "Update requires manual merge; no auto-merge enabled."
                      exit 0
                  fi
                  # GitHub waits for required CI checks and the existing review approval.
                  gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PR_HEAD_SHA"
